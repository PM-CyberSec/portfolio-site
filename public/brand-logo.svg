<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#131D33"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <rect x="10" y="10" width="180" height="180" rx="20" fill="none" stroke="#00FFCC" stroke-width="1.5" opacity="0.3"/>
  <!-- Terminal prompt -->
  <text x="32" y="80" font-family="monospace" font-size="16" fill="#00FFCC" opacity="0.6">$</text>
  <text x="48" y="80" font-family="monospace" font-size="16" fill="#FFFFFF" font-weight="700">0x0M</text>
  <!-- Cursor blink -->
  <rect x="132" y="66" width="10" height="16" fill="#00FFCC">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Portal-style ring -->
  <circle cx="100" cy="140" r="35" fill="none" stroke="#00FFCC" stroke-width="2" opacity="0.25"/>
  <circle cx="100" cy="140" r="28" fill="none" stroke="#00FFCC" stroke-width="1" opacity="0.15" stroke-dasharray="4 4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 140" to="360 100 140" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- Small shield -->
  <path d="M100 150 L88 143 L88 133 L100 126 L112 133 L112 143 Z" fill="none" stroke="#00FFCC" stroke-width="1.5" opacity="0.4"/>
</svg>
